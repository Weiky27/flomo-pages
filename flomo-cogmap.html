<!doctype html><html lang="zh"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>认知地图</title>
<style>
 :root{
   --sea:#0b0b0c; --ink:#e9e7e0; --dim:#8b8981;
   --panel:rgba(14,14,15,.97); --veil:rgba(11,11,12,.96);
   color-scheme:dark;
 }
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:var(--sea);color:var(--ink);
   font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
   -webkit-font-smoothing:antialiased;overflow:hidden}
 /* 地图就是页面本身：没有面板、没有卡片、没有给地图加边框 */
 #stage{position:fixed;inset:0}
 /* touch-action:none 是给触屏的：不关掉浏览器自己的手势，pointermove 会被抢走 */
 canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
 /* 放大或挪偏之后，画布就是一张可以拖的底图，光标得说出这件事 */
 body.off canvas{cursor:grab}
 body.off canvas:active{cursor:grabbing}

 /* 标题浮在左上角，不做标题栏 */
 #head{position:absolute;top:24px;left:26px;right:26px;max-width:540px;pointer-events:none}
 #head h1{margin:0;font-size:19px;font-weight:500;letter-spacing:.16em}
 #head p{margin:5px 0 0;font-size:12px;color:var(--dim);letter-spacing:.02em}

 /* 峰名由 canvas 直接画（见 placeNames）：缩放时要跟着地形重排，HTML 层做不到 */

 /* 右上角：回全图 + 主题。都是二级控件，压到最小 */
 #tools{position:absolute;top:22px;right:26px;display:flex;gap:8px;align-items:center;
   transition:right .28s cubic-bezier(.22,.61,.36,1)}
 /* 详情卡打开时也要让开，否则主题和「回全图」被卡片整个盖住 */
 body.card-open #tools{right:378px}
 /* 密文版的解锁面板：挂在工具栏底下，跟工具栏一起被卡片挤开 */
 #lockp{position:absolute;top:62px;right:26px;z-index:6;display:flex;gap:8px;align-items:center;
   flex-wrap:wrap;max-width:330px;padding:11px 13px;border-radius:11px;background:var(--panel);
   border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);
   transition:right .28s cubic-bezier(.22,.61,.36,1)}
 body.card-open #lockp{right:378px}
 #lockp[hidden]{display:none}
 #lockpin{font:13px/1 inherit;color:var(--ink);background:transparent;outline:none;width:132px;
   border:none;border-bottom:1px solid color-mix(in srgb,var(--ink) 30%,transparent);padding:4px 2px}
 #lockpin::placeholder{color:var(--dim)}
 #lockreml{display:flex;align-items:center;gap:4px;font:12px/1 inherit;color:var(--dim);cursor:pointer}
 #lockerr{flex-basis:100%;font:12px/1.5 inherit;color:var(--dim)}
 #lockerr:empty{display:none}
 #themes{display:flex;gap:8px}
 .pill{font:12px/1 inherit;color:var(--dim);background:transparent;cursor:pointer;
   border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:999px;
   padding:7px 12px;letter-spacing:.06em;font-family:inherit;
   transition:color .15s,border-color .15s,background .15s}
 .pill:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
 .pill[aria-pressed=true]{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 60%,transparent);
   background:color-mix(in srgb,var(--ink) 10%,transparent)}
 #fit{display:none}
 body.off #fit{display:block}

 /* 时间轴：常驻控件 */
 #bar{position:absolute;left:0;right:0;bottom:0;padding:16px 26px 20px;
   background:linear-gradient(to top,var(--veil) 40%,transparent);
   display:flex;align-items:center;gap:16px;transition:right .28s cubic-bezier(.22,.61,.36,1)}
 /* 详情卡打开时把时间轴让开，否则它盖住右边的月份和计数 */
 body.card-open #bar{right:352px}
 #play{width:34px;height:34px;flex:0 0 auto;border-radius:50%;cursor:pointer;
   border:1px solid color-mix(in srgb,var(--ink) 26%,transparent);background:transparent;color:var(--ink);
   display:grid;place-items:center;transition:background .15s,border-color .15s}
 #play:hover{background:color-mix(in srgb,var(--ink) 9%,transparent);
   border-color:color-mix(in srgb,var(--ink) 50%,transparent)}
 #track{position:relative;flex:1;height:26px;cursor:pointer}
 #rail{position:absolute;left:0;right:0;top:12px;height:1px;
   background:color-mix(in srgb,var(--ink) 16%,transparent)}
 #fill{position:absolute;left:0;top:12px;height:1px;
   background:color-mix(in srgb,var(--ink) 55%,transparent)}
 #knob{position:absolute;top:6px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;
   background:var(--ink);box-shadow:0 0 0 4px var(--sea)}
 .tick{position:absolute;top:9px;width:1px;height:7px;
   background:color-mix(in srgb,var(--ink) 22%,transparent)}
 /* 轴上 16 个月却只有刻度，不悬停根本不知道哪格是哪月。牌跟着月份走而不是跟着指针走，
    和旋钮跳格的方式一致。左端右端会顶出轨道，位置在 JS 里夹好。 */
 #mtip{position:absolute;bottom:calc(100% + 7px);left:0;padding:5px 9px 6px;border-radius:3px;
   background:var(--panel);border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);
   display:flex;align-items:baseline;gap:7px;white-space:nowrap;pointer-events:none;
   font-variant-numeric:tabular-nums;
   opacity:0;transform:translate(-50%,4px);
   transition:opacity .14s ease,transform .14s cubic-bezier(.22,.61,.36,1)}
 #mtip.on{opacity:1;transform:translate(-50%,0)}
 #mtip b{font-size:12px;font-weight:500;color:var(--ink);letter-spacing:.04em}
 #mtip span{font-size:11px;color:var(--dim)}
 body.walking #mtip{opacity:0}
 #when{flex:0 0 auto;font-size:12.5px;color:var(--dim);min-width:132px;text-align:right;
   font-variant-numeric:tabular-nums;letter-spacing:.03em}
 #when b{color:var(--ink);font-weight:500}
 /* 漫步横跨所有月份，这时候拖动月份轴会把小径连到还没出现在图上的笔记上。
     这是页面上唯一一处「关掉别的控件」的地方，所以必须同时留着两个出口：
     左下角的按钮和清单右上角那个 ×。 */
 body.walking #bar{opacity:.4;pointer-events:none}

 /* 随机漫步：左下角一枚按钮 */
 #walk{position:absolute;left:26px;bottom:88px;z-index:2}
 #walkbtn{font:12px/1 inherit;color:var(--dim);background:transparent;cursor:pointer;
   border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);border-radius:999px;
   padding:8px 14px;letter-spacing:.06em;font-family:inherit;
   transition:color .15s,border-color .15s}
 #walkbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 45%,transparent)}

 /* 漫步小径：一条随小径生长而逐条落下的清单，走完就是这次旅程的目录。
    原先是张明信片，只有统计没有笔记；改成侧栏后统计和清单在同一处，
    每一条还能点回去看全文——列表和地图就成了同一件东西的两个面。 */
 #journey{position:absolute;left:26px;top:96px;bottom:146px;width:300px;z-index:4;
   display:flex;flex-direction:column;
   background:var(--panel);border:1px solid color-mix(in srgb,var(--ink) 15%,transparent);
   border-radius:4px;overflow:hidden;
   opacity:0;transform:translateX(-10px);pointer-events:none;
   transition:opacity .28s ease,transform .28s cubic-bezier(.22,.61,.36,1)}
 #journey.on{opacity:1;transform:none;pointer-events:auto}
 #journey .jh{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 0}
 #journey h2{margin:0;font-size:11.5px;font-weight:500;letter-spacing:.2em;color:var(--dim)}
 #journey .x{width:22px;height:22px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);
   background:none;color:var(--dim);cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center}
 #journey .x:hover{color:var(--ink)}
 #journey .stats{padding:10px 14px 11px;display:grid;gap:5px;
   border-bottom:1px solid color-mix(in srgb,var(--ink) 11%,transparent)}
 #journey .row{display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.5}
 #journey .row span{color:var(--dim);flex:0 0 auto}
 #journey .row b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
 #journey .list{margin:0;padding:5px 0 8px;list-style:none;overflow-y:auto;flex:1}
 #journey .wrow{display:flex;gap:9px;align-items:flex-start;padding:7px 14px;cursor:pointer;
   animation:wrow .32s cubic-bezier(.22,.61,.36,1) both}
 @keyframes wrow{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
 #journey .wrow:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
 #journey .wrow.on{background:color-mix(in srgb,var(--ink) 9%,transparent)}
 #journey .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;margin-top:6px}
 #journey .col{flex:1;min-width:0}
 #journey .dt{display:block;font-size:11px;color:var(--dim);letter-spacing:.03em;
   font-variant-numeric:tabular-nums}
 #journey .tx{display:block;font-size:12.5px;line-height:1.5;margin-top:1px;
   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #journey .mk{flex:0 0 auto;font-style:normal;font-size:10.5px;color:var(--sel);
   border:1px solid color-mix(in srgb,var(--sel) 45%,transparent);border-radius:3px;
   padding:1px 5px;margin-top:3px}

 /* 详情卡：从右侧滑入，回答点击 */
 #card{position:absolute;top:0;right:0;bottom:0;width:352px;max-width:86vw;z-index:3;
   background:var(--panel);border-left:1px solid color-mix(in srgb,var(--ink) 12%,transparent);
   padding:52px 26px 26px;overflow-y:auto;transform:translateX(101%);
   transition:transform .28s cubic-bezier(.22,.61,.36,1)}
 #card.on{transform:none}
 #card .x{position:absolute;top:16px;right:18px;width:28px;height:28px;border-radius:50%;
   border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);background:none;color:var(--dim);
   cursor:pointer;font-size:15px;line-height:1;display:grid;place-items:center}
 #card .x:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
 #card .dt{font-size:12px;color:var(--dim);letter-spacing:.04em;font-variant-numeric:tabular-nums}
 #card .tg{margin:11px 0 0;display:flex;flex-wrap:wrap;gap:6px}
 #card .tg i{font-style:normal;font-size:11.5px;color:var(--dim);
   background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:3px;padding:2px 7px}
 #card .bd{margin:17px 0 0;font-size:14.5px;line-height:1.85;
   white-space:pre-wrap;word-break:break-word}
 #card .go{display:inline-block;margin-top:20px;font-size:12.5px;color:var(--dim);
   text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent);
   padding-bottom:1px}
 #card .go:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 60%,transparent)}

 #dbg{position:absolute;left:26px;bottom:132px;max-width:60vw;color:var(--dim);
   font:11px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;pointer-events:none}

 @media (max-width:720px){
   #head{top:16px;left:18px;right:18px;max-width:none} #head h1{font-size:16px}
   #tools{top:12px;right:16px;gap:6px} .pill{padding:6px 9px;font-size:11px}
   #themes{gap:6px}
   /* 手机上卡片铺在下半屏，顶部右上角本来就看不见冲突，别跟着左移 */
   body.card-open #tools{right:16px}
   #bar{padding:12px 18px 16px} #when{min-width:auto}
   body.card-open #bar{right:0}
   #walk{left:18px;bottom:80px} #dbg{bottom:168px}
   /* 手机上清单铺不满两侧，压在漫步按钮上方，别挡着底下的时间轴 */
   #journey{left:18px;right:18px;top:auto;bottom:132px;width:auto;height:auto;max-height:46%}
   #card{width:100%;max-width:100%;top:auto;height:66%;border-left:none;
     border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);transform:translateY(101%)}
   #card.on{transform:none}
   /* 卡片和清单在窄屏上会叠在一起，读全文时先让清单退场 */
   body.card-open #journey{opacity:0;pointer-events:none}
 }
</style>
<div id="stage">
 <canvas id="cv"></canvas>
 <div id="head">
   <h1>认知地图</h1>
   <p id="sub"></p>
 </div>
 <div id="tools">
   <button id="fit" class="pill">回全图</button>
   <span id="themes"></span>
   <button id="unlock" class="pill" hidden>🔒 解锁正文</button>
 </div>
 <div id="lockp" hidden>
   <input id="lockpin" type="password" placeholder="正文口令" autocomplete="current-password" aria-label="正文口令">
   <button id="lockgo" class="pill">解锁</button>
   <label id="lockreml"><input id="lockrem" type="checkbox">记住</label>
   <div id="lockerr" role="status" aria-live="polite"></div>
 </div>
 <div id="walk"><button id="walkbtn">随机漫步</button></div>
 <div id="journey">
   <div class="jh"><h2>漫步小径</h2><button class="x" aria-label="关闭">×</button></div>
   <div class="stats" aria-live="polite"></div>
   <ol class="list"></ol>
 </div>
 <div id="bar">
   <button id="play" aria-label="播放"></button>
   <div id="track"><div id="rail"></div><div id="fill"></div><div id="knob"></div><div id="mtip" aria-hidden="true"><b></b><span></span></div></div>
   <div id="when"></div>
 </div>
 <div id="card" role="dialog" aria-modal="false">
   <button class="x" aria-label="关闭">×</button>
   <div class="dt"></div><div class="tg"></div><div class="bd"></div>
   <a class="go" target="_blank" rel="noreferrer">在 flomo 中打开原文</a>
 </div>

</div>
<script>
const DBG=document.getElementById('dbg'),L=[];
addEventListener('error',e=>{if(DBG)DBG.textContent='ERR '+e.message+' @'+e.lineno+String.fromCharCode(10)+L.join(String.fromCharCode(10));});
</script>

let TH=THEMES.ink, COLS=TH, HUES=TH.hues;
const themesEl=document.getElementById('themes'), tbtn={};
for(const k of THEME_KEYS){
  const b=document.createElement('button');
  b.className='pill'; b.textContent=THEMES[k].name; b.title=THEMES[k].name;
  b.addEventListener('click',()=>applyTheme(k));
  themesEl.appendChild(b); tbtn[k]=b;
}
function applyTheme(k){
  TH=THEMES[k]; COLS=TH; HUES=TH.hues;
  const r=document.documentElement.style;
  r.setProperty('--sea',TH.sea); r.setProperty('--ink',TH.ink); r.setProperty('--dim',TH.dim);
  r.setProperty('--panel',TH.panel); r.setProperty('--veil',TH.veil);
  r.setProperty('--sel',TH.sel);
  document.documentElement.style.colorScheme=TH.dark?'dark':'light';
  for(const j in tbtn)tbtn[j].setAttribute('aria-pressed',j===k?'true':'false');
}

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const DPR=Math.min(2,devicePixelRatio||1);
let W=1200,H=760;
function size(){
  const r=cv.parentElement.getBoundingClientRect();
  W=Math.max(320,Math.round(r.width)); H=Math.max(300,Math.round(r.height));
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
  // 画布尺寸一变，夹紧的边界也跟着变，先把相机拉回合法范围再定位一次，
  // 否则窗口拉窄之后地图会有一半留在画布外面。
  zanim=null; bakeAt=0; cam=clampT(cam); want=clampT(want);
  layout();

  cache.clear(); dgrid.length=0;
}

// ============================================================
// 相机。z=1 是「刚好铺满画布」的基准布局，屏幕 = z × 基准屏幕坐标 + (tx,ty)。
// 之所以写成平移+缩放而不是「锚点 + 倍率」：拖动要的是纯粹的平移自由度，
// 而锚点式在 z=1 处会退化（改锚点不产生任何位移），拖不动。
// 它仍是同一个仿射变换，所以「屏幕上最近」依然等价于「数据空间里最近」，

bx0=bx1=P[0].x; by0=by1=P[0].y;

// 挪满会把地图挤小，不挪则一半藏进清单底下。
function leftInset(){return (walk&&W>720)?338:0;}
function bottomInset(){return (walk&&W<=720)?Math.round(H*0.46):0;}
// 底部被卡片或清单盖掉的高度。盖住的那块不必再让内容去铺满，夹紧的下界就跟着放宽——

// 整块留在画布内，位置被钉死，指哪都挪不动。
function bottomCover(){

}
let cam={z:1,tx:0,ty:0};    // 已经烘焙进 sc/ox/oy 的那一版
let want={z:1,tx:0,ty:0};   // 用户此刻要的那一版（拖动/滚轮立刻改它，稍后才烘焙）
const ZMAX=8;
function layout(){
  const X=PADX(), bi=bottomInset();
  base=Math.min((W-2*X)/((bx1-bx0)||1),(H-bi-PADT-PADB)/((by1-by0)||1));
  cw0=(bx1-bx0)*base; ch0=(by1-by0)*base;
  fx0=(W-cw0)/2+leftInset()/2;
  fy0=H-bi-PADB-(H-bi-PADT-PADB-ch0)/2;  // 内容底边的基准 y
  sc=base*cam.z;
  ox=cam.tx+cam.z*fx0;
  oy=cam.ty+cam.z*fy0;
}
const px=p=>ox+(p.x-bx0)*sc, py=p=>oy-(p.y-by0)*sc;

// 夹紧：只要求「整块内容留在画布上」，不要求它铺满——所以允许的区间总是
// 从「上边缘贴上」到「下边缘贴下」这两端之间。内容比视口大时这两端正好互为里外，
// 内容比视口小时它们之间就是两侧的留白。写成同一个式子，是因为这两种情况下
// 两个端点只是换了大小关系：装得下要整块不出去，装不下要边缘不进画面。
// 不用「内容比视口小就居中」那种夹法：那会在低倍率下把滚轮的指针锚点硬拉回来，
// 手感和眼睛对不上。安全网交给常驻的「回全图」，不交给夹紧。
// V0/V1 是视口里「露着的那条带」的上下沿，不是整个画布：标题压着的顶端、
// 面板盖住的底端都不算数，内容没铺到那儿也不会露出底色。
function clampAxis(t,z,c0,c1,V0,V1){
  const a=V0-z*c0, b=V1-z*c1;
  return Math.max(Math.min(a,b), Math.min(Math.max(a,b), t));
}
function clampT(c){
  return {z:c.z,
    tx:clampAxis(c.tx,c.z,fx0,fx0+cw0,0,W),
    ty:clampAxis(c.ty,c.z,fy0-ch0,fy0,PADT,H-bottomCover())};
}
// 相机离「全图」有多远——决定「回全图」按钮和拖动光标在不在
function offFit(c){return c.z>1.001||Math.abs(c.tx)>1||Math.abs(c.ty)>1;}

// 缩放/平移期间不重算场——那是上百毫秒——只对已烘焙的那一帧做仿射拉伸 T(q)=z·q+t。
// 手感停顿 130ms 后再烘焙一次，于是停下来的画面是锐的。
let zanim=null,bakeAt=0;
function bakeCam(c){
  cam=c; cache.clear(); dgrid.length=0; layout();
  // zoomed 管「操作提示」，off 管「回全图按钮 + 可拖动光标」——
  // 平移到边上而没有放大时，出口同样必须露出来。
  document.body.classList.toggle('zoomed',cam.z>1.001);
  document.body.classList.toggle('off',offFit(cam));
}
// 直接操作：立刻改 want，拉伸的倍率如果超过了 1.5 就先烘焙一次，
// 否则等高线会被位图放大糊成一片。
function applyDirect(target){
  zanim=null; want=clampT(target);
  const r=want.z/cam.z;
  if(r>1.5||r<1/1.5){bakeAt=0;bakeCam(want);}
  else bakeAt=performance.now()+130;
}
// 按钮和点击走带缓动的动画
function flyTo(target,dur){
  const from=wantCam(), to=clampT(target);
  if(Math.abs(to.z-cam.z)<1e-3&&Math.abs(to.tx-cam.tx)<.6&&Math.abs(to.ty-cam.ty)<.6){
    zanim=null;bakeAt=0;want=to;bakeCam(to);return;
  }
  bakeAt=0; want=to;
  zanim={t0:performance.now(),dur:dur||360,from,to};
}
// 把悬着的动画/待烘焙落定到「眼睛此刻看到的位置」，点击前先同步，
// 否则 px/py 用的还是上一版相机，命中判定会整体偏掉。
function syncNow(){
  if(!zanim&&!bakeAt)return;
  const c=clampT(wantCam()); zanim=null;bakeAt=0;want=c;bakeCam(c);
}
function wantCam(){
  if(!zanim)return want;
  const k=Math.min(1,(performance.now()-zanim.t0)/zanim.dur);
  const e=1-Math.pow(1-k,3), a=zanim.from, b=zanim.to;
  return {z:a.z+(b.z-a.z)*e, tx:a.tx+(b.tx-a.tx)*e, ty:a.ty+(b.ty-a.ty)*e};
}
// 把「已烘焙相机的屏幕坐标」映射到「此刻的屏幕坐标」
function viewT(){
  const w=wantCam();
  if(Math.abs(w.z-cam.z)<1e-4&&Math.abs(w.tx-cam.tx)<.4&&Math.abs(w.ty-cam.ty)<.4)return null;
  const s=w.z/cam.z;
  return {k:1,s,tx:w.tx-s*cam.tx,ty:w.ty-s*cam.ty};
}
// 以屏幕点 q 为不动点缩放：q 底下的那块地形在缩放前后停在同一个位置
function zoomAbout(qx,qy,z){
  const w=wantCam(), s=z/w.z;
  return {z,tx:qx-s*(qx-w.tx),ty:qy-s*(qy-w.ty)};
}
// 点开一条笔记时，把它挪到「没被任何面板盖住的那条带子」的正中。
// 窄屏上清单是压在下半屏的横条，不再占左侧，所以这里要跟着媒体查询一起判断。
// 地图上「还看得见」的那块矩形。桌面卡片从右侧进来，窄屏卡片从下方进来，
// 焦点要送到它中间，不然点了笔记、笔记正好压在卡片底下。
function mapBand(){
  const wide=W>720, open=tipEl.classList.contains('on');
  const l=leftInset();
  const r=(open&&wide)?352:0;
  // 窄屏上卡片一开，清单就退场了，两者不能一起算——一起算会把可见带压成负数。
  const cover=(open&&!wide)?Math.round(H*0.66):bottomInset();
  // 卡片压在下面时，底部那条本来就归卡片，不用再为时间轴留白
  const pad=(open&&!wide)?12:PADB;
  return {x0:l,x1:Math.max(l+120,W-r),
          y0:PADT,y1:Math.max(PADT+120,H-cover-pad)};
}
function focusNote(p,z){
  const band=mapBand();
  const cx=(band.x0+band.x1)/2, cy=(band.y0+band.y1)/2;
  const bxq=fx0+(p.x-bx0)*base, byq=fy0-(p.y-by0)*base;
  flyTo({z,tx:cx-z*bxq,ty:cy-z*byq});
}

// ---- 核带宽：中位最近邻 × BW_F。BW 是数据单位，用前必须乘 sc 换成像素 ----
const nnd=P.map((a,i)=>{let b=Infinity;
  for(let j=0;j<P.length;j++){if(j===i)continue;const d=Math.hypot(a.x-P[j].x,a.y-P[j].y);if(d<b)b=d;}
  return b;}).sort((a,b)=>a-b);
const BW=nnd[Math.floor(nnd.length/2)]*BW_F;

// ---- 月份状态 ----
const MAXM=months.length-1;
let curM=OPEN_M>0?Math.min(OPEN_M,MAXM):MAXM;
let playing=false;

// ============================================================
// 高度场 → 等高线。按月份缓存：回放时同一帧只算一次。
// 高度只数点数（权重恒为 1）——这就是 flomo 的语义：等高线越密 = 该主题笔记越多。
// ============================================================
const cache=new Map();
// 逐月累积的密度网格。核是可加的：第 m 月的网格 = 第 m-1 月的网格 + 本月新增点的那几团核，
// 两者逐格相加得到的数和从零重算完全一样（浮点求和顺序不同，差异在 1e-7 量级，看不见）。
// 键里带画布尺寸——窗口一变，px/py/sc 全变了，累积网格必须整批作废。
const dgrid=[];
let dkey='';
const byMonth=[];
for(const p of P)(byMonth[p.m]||(byMonth[p.m]=[])).push(p);

function densityAt(maxM){
  const GS=GSZ,GW=Math.ceil(W/GS),GH=Math.ceil(H/GS);
  const key=W+'x'+H+'|'+cam.z.toFixed(4)+'|'+cam.tx.toFixed(1)+'|'+cam.ty.toFixed(1);
  if(key!==dkey){dgrid.length=0;dkey=key;}
  if(dgrid[maxM])return dgrid[maxM];
  const SIG=BW*sc,RK=3.7,rC=SIG*RK/GS,inv=1/(2*(SIG/GS)*(SIG/GS));
  let base=-1;
  for(let i=maxM-1;i>=0;i--)if(dgrid[i]){base=i;break;}
  const g=base>=0?Float32Array.from(dgrid[base]):new Float32Array(GW*GH);
  for(let m=base+1;m<=maxM;m++){
    for(const p of byMonth[m]||[]){
      const cx=px(p)/GS,cy=(H-py(p))/GS;
      const i0=Math.max(0,Math.floor(cx-rC)),i1=Math.min(GW-1,Math.ceil(cx+rC));
      const j0=Math.max(0,Math.floor(cy-rC)),j1=Math.min(GH-1,Math.ceil(cy+rC));
      for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
        const dx=i-cx,dy=j-cy,q=(dx*dx+dy*dy)*inv;
        if(q<RK*RK)g[j*GW+i]+=Math.exp(-q);
      }
    }
    if(m<maxM)dgrid[m]=Float32Array.from(g);
  }
  dgrid[maxM]=g;
  return g;
}

// 只是要 18 个分位数（17 条等高线 + 海平面），不值得把 32 万个格子整个排一遍——
// 实测那一步在浏览器里要 280ms，是逐月回放卡顿的主因。
// 非负 IEEE-754 浮点的位模式和它的数值同序，所以按「高 16 位」桶计数就能一次定位分位数；
// 桶是按指数分档的，对 KDE 这种极度右偏的分布恰好合适。桶内再按位模式线性插值——
// 位模式是对数尺度，比在数值上插值准得多。实测与精确排序最大相对差 0.16%，耗时 6ms : 75ms。
const QBUF=new ArrayBuffer(4),QF=new Float32Array(QBUF),QU=new Uint32Array(QBUF);
function quantilesAt(grid,ps){
  const NB=65536;
  const u=new Uint32Array(grid.buffer,grid.byteOffset,grid.length);
  const hist=new Int32Array(NB);
  for(let i=0;i<u.length;i++)hist[u[i]>>>16]++;
  const cum=new Int32Array(NB+1);
  for(let b=0;b<NB;b++)cum[b+1]=cum[b]+hist[b];
  const n=grid.length,out=[];
  for(const p of ps){
    const r=Math.min(n-1,Math.max(0,Math.round(p*(n-1))));
    let lo=0,hi=NB;
    while(lo<hi){const md=(lo+hi)>>1;if(cum[md+1]<=r)lo=md+1;else hi=md;}
    const b=lo,frac=(r-cum[b]+0.5)/(hist[b]||1);
    const bits=((((b<<16)>>>0)+Math.round(frac*65536))>>>0);
    QU[0]=bits>0x7f7fffff?0x7f7fffff:bits;
    out.push(QF[0]);
  }
  return out;
}

// marching squares 的边点坐标与峰检测的膨胀缓冲：跨调用复用，避免每个格子都新建对象
// （每个跨线格子分配一个对象+四个数组+一个闭包，是那段一度占掉一半时间的原因）
const EX=new Float64Array(4),EY=new Float64Array(4);
const SBUF={};
// 边编号 → 该掩码要连的两条线段（0=T 1=R 2=B 3=L）
const T={1:[3,2],2:[2,1],3:[3,1],4:[0,1],5:[0,3,2,1],6:[0,2],7:[0,3],
  8:[0,3],9:[0,2],10:[0,1,3,2],11:[0,1],12:[3,1],13:[2,1],14:[3,2]};

function field(maxM){
  if(cache.has(maxM))return cache.get(maxM);
  const live=P.filter(p=>p.m<=maxM);
  const GS=GSZ,GW=Math.ceil(W/GS),GH=Math.ceil(H/GS);
  const grid=densityAt(maxM);
  // 等高线不用等值距，用等分位：每条线之间夹的格子数一样多，圈才是均匀套着的。
  // 等值距会让最外圈甩得极远、里面全挤在峰顶一小坨。
  const ps=[];
  for(let k=1;k<=LEVELS;k++)ps.push(OUT_Q+(1-OUT_Q)*(k/LEVELS));
  ps.push(OUT_Q);
  const qs=quantilesAt(grid,ps);
  const levels=qs.slice(0,LEVELS),sea=qs[LEVELS];

  // ---- marching squares：四角 a=(i,j) b=(i+1,j) c=(i+1,j+1) e=(i,j+1)，掩码 a=8 b=4 c=2 e=1 ----
  // 边编号 0=T 1=R 2=B 3=L，坐标写进复用的 EX/EY，不每个格子新建对象和闭包——
  // 那是这一段的全部开销来源（原来每个跨线的格子要分配一个对象、四个数组和一个函数）。
  const paths=levels.map(()=>new Path2D());
  // 一个格子只对落在 [min,max) 里的层切得出线。levels 是升序的，二分定位这段区间即可——
  // 原来每层都把 32 万个格子扫一遍，而绝大多数格子一层都框不住。
  const lower=v=>{let lo=0,hi=levels.length;while(lo<hi){const md=(lo+hi)>>1;if(levels[md]<v)lo=md+1;else hi=md;}return lo;};
  for(let j=0;j<GH-1;j++)for(let i=0;i<GW-1;i++){
    const a=grid[j*GW+i],b=grid[j*GW+i+1],c=grid[(j+1)*GW+i+1],e=grid[(j+1)*GW+i];
    let mn=a,mx=a;
    if(b<mn)mn=b;else if(b>mx)mx=b;
    if(c<mn)mn=c;else if(c>mx)mx=c;
    if(e<mn)mn=e;else if(e>mx)mx=e;
    if(mn===mx)continue;
    for(let li=lower(mn);li<levels.length;li++){
      const lv=levels[li];
      if(lv>=mx)break;
      const id=(a>lv?8:0)|(b>lv?4:0)|(c>lv?2:0)|(e>lv?1:0);
      const t=(u,v)=>(lv-u)/((v-u)||1e-9);
      EX[0]=(i+t(a,b))*GS; EY[0]=j*GS;
      EX[1]=(i+1)*GS;      EY[1]=(j+t(b,c))*GS;
      EX[2]=(i+t(e,c))*GS; EY[2]=(j+1)*GS;
      EX[3]=i*GS;          EY[3]=(j+t(a,e))*GS;
      const pa=paths[li],S=T[id];
      pa.moveTo(EX[S[0]],EY[S[0]]); pa.lineTo(EX[S[1]],EY[S[1]]);
      if(S.length===4){pa.moveTo(EX[S[2]],EY[S[2]]);pa.lineTo(EX[S[3]],EY[S[3]]);}
    }
  }

  // ---- 峰：高度场的局部极大 ----
  // 用横竖两遍一维滑动最大值（单调队列），而不是每个候选格去扫 27×27 的窗口：
  // 后者是 O(格子数 × 窗口面积)，一个月就要跑五千万次比较，是回放卡顿的主因。
  // 「(i,j) 等于窗口内最大值」⟺「它等于先横后竖两遍膨胀后的值」，两遍都是线性的，结果不变。
  const win=Math.max(2,Math.round(26/GS)),cand=[];
  {
    const cells=GW*GH;
    if(!SBUF.hmax||SBUF.n!==cells){SBUF.hmax=new Float32Array(cells);SBUF.dmax=new Float32Array(cells);SBUF.n=cells;}
    if(!SBUF.dqh||SBUF.dqh.length<GW+1)SBUF.dqh=new Int32Array(GW+1);
    if(!SBUF.dqv||SBUF.dqv.length<GH+1)SBUF.dqv=new Int32Array(GH+1);
    const hmax=SBUF.hmax,dmax=SBUF.dmax,dqh=SBUF.dqh,dqv=SBUF.dqv;
    for(let j=0;j<GH;j++){
      const row=j*GW;let h=0,t=0,nx=0;
      for(let c=0;c<GW;c++){
        const hi=Math.min(GW-1,c+win);
        while(nx<=hi){const v=grid[row+nx];while(t>h&&grid[row+dqh[t-1]]<=v)t--;dqh[t++]=nx;nx++;}
        const lo=c-win;while(t>h&&dqh[h]<lo)h++;
        hmax[row+c]=grid[row+dqh[h]];
      }
    }
    for(let i=0;i<GW;i++){
      let h=0,t=0,nx=0;
      for(let c=0;c<GH;c++){
        const hi=Math.min(GH-1,c+win);
        while(nx<=hi){const v=hmax[nx*GW+i];while(t>h&&hmax[dqv[t-1]*GW+i]<=v)t--;dqv[t++]=nx;nx++;}
        const lo=c-win;while(t>h&&dqv[h]<lo)h++;
        dmax[c*GW+i]=hmax[dqv[h]*GW+i];
      }
    }
    for(let j=win;j<GH-win;j++)for(let i=win;i<GW-win;i++){
      const idx=j*GW+i,v=grid[idx];
      if(v<=sea||v<dmax[idx])continue;
      cand.push({X:i*GS,Y:j*GS,v});
    }
  }
  cand.sort((a,b)=>b.v-a.v);
  // 每座峰先认领最近的那条笔记所属的簇。px/py 是同一个 sc 的仿射变换，
  // 所以「屏幕上最近」和「数据空间里最近」是同一件事——这个归属不随视口变。
  for(const pk of cand){
    let best=null,bd=Infinity;
    for(const p of live){const d=(px(p)-pk.X)**2+(py(p)-pk.Y)**2;if(d<bd){bd=d;best=p;}}
    pk.c=best?best.c:-1;
  }
  // 选峰分两步。纯按高度取，全局最高的十几个点会全落在两三个大簇上，
  // 稀疏簇一个峰都拿不到（实测 8 个簇里有 2 个空手），而地名正是这张图最要紧的信息。
  // 所以：① 每个簇先保一个自己的主峰；② 剩下的名额再按高度补，纯粹为了多几个山头好看。
  const peaks=[];
  {
    const best=new Map();
    for(const pk of cand) if(pk.c>=0&&!best.has(pk.c)) best.set(pk.c,pk);
    for(const pk of best.values()) peaks.push(pk);
    for(const pk of cand){
      if(peaks.length>=NPRK)break;
      if(pk.c<0||best.get(pk.c)===pk)continue;
      if(peaks.some(q2=>Math.hypot(q2.X-pk.X,q2.Y-pk.Y)<104))continue;
      peaks.push(pk);
    }
  }
  // 标签上的「N 条」取该簇的总数——标签写的是簇名，数字就该是簇的数量，
  // 而且它只跟数据有关，不会随窗口大小变。
  {
    const csize={};
    for(const p of live) csize[p.c]=(csize[p.c]||0)+1;
    for(const pk of peaks) pk.n=csize[pk.c]||0;
  }
  const out={paths,levels,peaks,n:live.length,GW,GH,GS};
  cache.set(maxM,out);
  return out;
}

// ============================================================
// 画
// ============================================================
const tipEl=document.getElementById('card'),journeyEl=document.getElementById('journey');
let sel=null;          // 被点开的笔记
let walk=null;         // 随机漫步
const FONT_N='600 14.5px "Songti SC","Noto Serif CJK SC",STSong,serif';
const FONT_C='11px system-ui,-apple-system,"PingFang SC",sans-serif';

// 山峰：两座山脊 + 雪顶，而不是一个抽象三角形。
// 峰身的颜色就是簇色，雪顶用底色反白——所以 glyph 必须能染色，
// 这正是不用 ⛰️ 那个 emoji 的原因：emoji 是彩色位图，改不了色，
// 而在这张图上颜色就是簇的身份。
function peakGlyph(X,Y,hue){
  ctx.beginPath();
  ctx.moveTo(X-8,Y+5.4);
  ctx.lineTo(X-4.2,Y-1.8);
  ctx.lineTo(X-1.2,Y+1.6);
  ctx.lineTo(X+3.4,Y-6.2);
  ctx.lineTo(X+8,Y+5.4);
  ctx.closePath();
  ctx.fillStyle=hue; ctx.fill();
  ctx.lineWidth=1.1; ctx.strokeStyle=COLS.halo; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(X+2.0,Y-3.4);
  ctx.lineTo(X+3.4,Y-6.2);
  ctx.lineTo(X+4.8,Y-3.4);
  ctx.lineTo(X+4.0,Y-4.2);
  ctx.lineTo(X+3.4,Y-3.1);
  ctx.lineTo(X+2.8,Y-4.3);
  ctx.closePath();
  ctx.fillStyle=COLS.cap; ctx.fill();
}

// 地形的一次完整绘制
function paint(f,live,now){
  // 等高线：细、暗，越往里越亮。没有填充和阴影之后，疏密就是全部的地形信息
  for(let i=0;i<f.paths.length;i++){
    const t=(i+1)/f.paths.length;
    ctx.strokeStyle=COLS.faint+(0.10+0.30*t*t).toFixed(3)+')';
    ctx.lineWidth=0.75+0.6*t;
    ctx.stroke(f.paths[i]);
  }
  // 点：一律米白、小、半透明。不按簇上色——颜色只留给峰标，
  // 密集处自然叠亮，这就是「哪里笔记多」的第二种读法
  const pulse=playing?0.5+0.5*Math.sin(now/260):0;
  for(const p of live){
    const X=px(p),Y=py(p);
    const hot=p.m===curM&&curM>0;
    ctx.beginPath(); ctx.arc(X,Y,hot?2.3:1.85,0,7);
    ctx.globalAlpha=hot?(0.55+0.45*pulse):0.52;
    ctx.fillStyle=hot?COLS.cap:COLS.ink; ctx.fill();
  }
  ctx.globalAlpha=1;
  // 峰标：每个峰都画，但每个簇只有最高的那个峰配名字——
  // 地图上同一个地名出现两次是错的，可山峰本身有几个就得画几个
  for(const pk of f.peaks) peakGlyph(pk.X,pk.Y,HUES[(+pk.c)%8]);
}

// 随机漫步的小径：把走过的笔记用一条折线连起来，逐段长出来。
// flomo 把这个功能列在「未来」里，这里先把它做出来。
function drawWalk(){
  if(!walk)return;
  const n=walk.path.length-1;
  const total=walk.t*n, full=Math.floor(total), frac=total-full;
  const pt=i=>P[walk.path[i]];
  ctx.save();
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(px(pt(0)),py(pt(0)));
  for(let i=1;i<=Math.min(full,n);i++)ctx.lineTo(px(pt(i)),py(pt(i)));
  if(full<n){const a=pt(full),b=pt(full+1);
    ctx.lineTo(px(a)+(px(b)-px(a))*frac,py(a)+(py(b)-py(a))*frac);}
  // 先描一圈底色再描小径：小径要压在密点上，光有颜色读不出来
  ctx.strokeStyle=COLS.halo; ctx.lineWidth=4.4; ctx.stroke();
  ctx.strokeStyle=COLS.trail; ctx.lineWidth=1.8; ctx.stroke();
  // 踩过的笔记
  for(let i=0;i<=Math.min(full,n);i++){
    ctx.beginPath(); ctx.arc(px(pt(i)),py(pt(i)),2.1,0,7);
    ctx.fillStyle=COLS.trail; ctx.fill();
  }
  // 走到哪儿的那个头
  if(full<n){
    const a=pt(full),b=pt(full+1);
    const hx=px(a)+(px(b)-px(a))*frac, hy=py(a)+(py(b)-py(a))*frac;
    ctx.beginPath(); ctx.arc(hx,hy,4.6,0,7);
    ctx.fillStyle=COLS.trail; ctx.fill();
    ctx.lineWidth=1.3; ctx.strokeStyle=COLS.halo; ctx.stroke();
  }
  ctx.restore();
}

// 被点开的那条笔记：暖色高亮，带一圈呼吸
function drawSel(now){
  if(!sel||sel.m>curM)return;
  const X=px(sel),Y=py(sel);
  const ph=0.5+0.5*Math.sin(now/430);
  ctx.save();
  ctx.beginPath(); ctx.arc(X,Y,6.2+2.6*ph,0,7);
  ctx.globalAlpha=0.30+0.45*(1-ph);
  ctx.strokeStyle=COLS.sel; ctx.lineWidth=1.3; ctx.stroke();
  ctx.globalAlpha=1;
  ctx.beginPath(); ctx.arc(X,Y,2.9,0,7);
  ctx.fillStyle=COLS.sel; ctx.fill();
  ctx.lineWidth=1.2; ctx.strokeStyle=COLS.halo; ctx.stroke();
  ctx.restore();
}

// 地名：直接画在 canvas 上而不是 HTML。缩放时要跟着地形重排，HTML 层做不到。
function placeNames(pks){
  const done=new Set(),spots=[];
  ctx.textAlign='left'; ctx.textBaseline='middle';
  // 光晕用描边而不是模糊阴影：字体只有 14.5px，模糊阴影在密点背景上糊不住笔画，
  // 而描边是一圈实心的底色，字压在任何东西上都读得出来（地图上标地名的老办法）。
  ctx.lineJoin='round'; ctx.miterLimit=2;
  ctx.strokeStyle=COLS.halo;
  for(const pk of pks){
    if(done.has(pk.c))continue; done.add(pk.c);
    const name=labels[(+pk.c)%labels.length]||'';
    if(!name)continue;
    ctx.font=FONT_N;
    const w=ctx.measureText(name).width, bw=Math.max(58,w+30), bh=36;
    let spot=null;
    for(const[dx,dy]of[[0,-26],[0,28],[-bw/2-14,-10],[bw/2+14,-10],[0,-54]]){
      const cx=pk.X+dx,cy=pk.Y+dy;
      const r={x0:cx-bw/2,x1:cx+bw/2,y0:cy-bh/2,y1:cy+bh/2};
      if(r.x0<6||r.x1>W-6||r.y0<6||r.y1>H-6)continue;
      if(spots.some(q2=>r.x0<q2.x1&&r.x1>q2.x0&&r.y0<q2.y1&&r.y1>q2.y0))continue;
      spot={cx,cy,r};break;
    }
    if(!spot)continue;
    spots.push(spot.r);
    ctx.lineWidth=4.2;
    ctx.fillStyle=HUES[(+pk.c)%8];
    ctx.strokeText(name,spot.cx-w/2,spot.cy-7);
    ctx.fillText(name,spot.cx-w/2,spot.cy-7);
    ctx.font=FONT_C;
    ctx.lineWidth=3.4;
    ctx.fillStyle=COLS.dim;
    ctx.strokeText(pk.n+' 条',spot.cx-w/2,spot.cy+10);
    ctx.fillText(pk.n+' 条',spot.cx-w/2,spot.cy+10);
  }
}

function draw(now){
  requestAnimationFrame(draw);   // 先排队再画：中途抛异常也不会把渲染循环打死
  // 落定：缓动动画走完、或者拖动/滚轮停下 130ms 之后，把 want 烘焙成真相机，
  // 场会在这一帧之后按新相机重算，于是停下来的画面是锐的。
  if(zanim&&now-zanim.t0>=zanim.dur){zanim=null;bakeAt=0;bakeCam(want);}
  else if(bakeAt&&now>=bakeAt){bakeAt=0;bakeCam(want);}
  const v=viewT();
  const f=field(curM);
  const live=P.filter(p=>p.m<=curM);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=COLS.sea; ctx.fillRect(0,0,W,H);

  // 动画期间对已烘焙的那一帧做仿射拉伸：T(q)=s*q+t
  if(v)ctx.setTransform(DPR*v.s,0,0,DPR*v.s,DPR*v.tx,DPR*v.ty);
  // rAF 的 now 是帧起点，可能早于 startWalk 时的 performance.now()，
  // 不夹下界就会算出负的 walk.t，full=Math.floor(负数) 变成负下标，pt() 直接 undefined。
  if(walk&&!walk.done){
    walk.t=Math.max(0,Math.min(1,(now-walk.t0)/walk.dur));
    // 清单跟着小径一起长：小径走到第几条，清单就落到第几条。
    // 一次性全列出来等于把旅程剧透完，那这条小径就没有走的意义了。
    const rev=Math.min(walk.path.length,Math.floor(walk.t*(walk.path.length-1))+1);
    if(rev>walk.shown)revealUpTo(rev);
    if(walk.t>=1)walk.done=true;
  }
  paint(f,live,now);
  drawWalk();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // 地名和选中高亮不进变换：字号不跟着缩放走（地图缩放放大的是地形，不是字），
  // 位置则手工套一遍同一个 T
  const pks=v?f.peaks.map(pk=>({X:v.s*pk.X+v.tx,Y:v.s*pk.Y+v.ty,c:pk.c,n:pk.n})):f.peaks;
  placeNames(pks);
  drawSel(now);

  document.getElementById('sub').textContent=
    P.length+' 条笔记，从 '+months[0].slice(0,4)+' 年 '+Number(months[0].slice(5,7))
    +' 月记到现在。线越密的地方，你写得越多。';
  if(DBG_ON)document.getElementById('dbg').textContent=NL+
    '带宽 σ '+(BW*sc).toFixed(1)+'px   网格 '+f.GW+'x'+f.GH+'   第 '+(curM+1)+'/'+months.length+' 月   在场 '+f.n+' 条'+NL+
    'cam z='+cam.z.toFixed(2)+' t=('+cam.tx.toFixed(0)+','+cam.ty.toFixed(0)+')'+
    '   want z='+wantCam().z.toFixed(2)+(zanim?' [anim]':'')+(bakeAt?' [bake]':'')+
    '   选中='+(sel?sel.d:'null')+'   漫步='+(walk?walk.shown+'/'+walk.path.length+' 步':'null')+'   W='+W+' H='+H;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ============================================================
// 交互
// ============================================================
function toLocal(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
function fitAll(){
  // 已经在全图上了就别再走一遍「烘焙」，那是一次没必要的一百多毫秒卡顿
  if(!zanim&&!bakeAt&&!offFit(wantCam()))return;
  flyTo({z:1,tx:0,ty:0});
}
document.getElementById('fit').addEventListener('click',fitAll);
cv.addEventListener('dblclick',e=>{e.preventDefault();fitAll();});

// ---- 拖拽平移。pointer 事件一并覆盖鼠标和触屏，canvas 上的 touch-action 已经关掉 ----
let panning=false,lastX=0,lastY=0,dragged=0;
cv.addEventListener('pointerdown',e=>{
  if(e.button)return;
  syncNow(); panning=true; dragged=0; lastX=e.clientX; lastY=e.clientY;
  try{cv.setPointerCapture(e.pointerId);}catch{}
});
cv.addEventListener('pointermove',e=>{
  if(!panning)return;
  const r=cv.getBoundingClientRect();
  const dx=(e.clientX-lastX)*W/r.width, dy=(e.clientY-lastY)*H/r.height;
  lastX=e.clientX; lastY=e.clientY;
  dragged+=Math.abs(dx)+Math.abs(dy);
  if(dragged<3)return;                 // 手抖不算拖
  const w=wantCam();
  applyDirect({z:w.z,tx:w.tx+dx,ty:w.ty+dy});
});
const endPan=e=>{panning=false;try{cv.releasePointerCapture(e.pointerId);}catch{}};
cv.addEventListener('pointerup',endPan);
cv.addEventListener('pointercancel',endPan);

// ---- 滚轮缩放。以指针为不动点，指针底下那块地形不动，人就不会迷路。
// deltaMode 有三档（像素/行/页），不折算的话行模式的滚轮会快 16 倍。 ----
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const m=toLocal(e);
  const d=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*H:e.deltaY;
  const w=wantCam();
  applyDirect(zoomAbout(m.x,m.y,Math.max(1,Math.min(ZMAX,w.z*Math.exp(-d*0.0016)))));
},{passive:false});

cv.addEventListener('click',e=>{
  if(dragged>4)return;                 // 刚拖过，这一次抬起不算点击
  syncNow();
  const m=toLocal(e);
  // 先看是不是点在笔记上：15px 内算命中
  let best=null,bd=15;
  for(const p of P){
    if(p.m>curM)continue;
    const d=Math.hypot(px(p)-m.x,py(p)-m.y);
    if(d<bd){bd=d;best=p;}
  }
  if(best){openCard(best);revealNote(best);return;}
  closeCard();
  // 点空白 = 钻进这一片。flomo 的说法是「点击任意区域，就会聚焦到一个笔记范围」——
  // 是放大进去，不是往图上按一个放大镜。
  const x=Math.min(W-1,Math.max(0,m.x)),y=Math.min(H-1,Math.max(0,m.y));
  flyTo(zoomAbout(x,y,Math.min(ZMAX,wantCam().z*2.2)));
});
// 点开一条笔记之后，得把它弄进「没被任何面板盖住的那条带子」里
function revealNote(p){
  const w=wantCam(), band=mapBand();
  if(w.z<2.8){focusNote(p,2.8);return;}
  const sx=w.z*(fx0+(p.x-bx0)*base)+w.tx;
  const sy=w.z*(fy0-(p.y-by0)*base)+w.ty;
  if(sx<band.x0+24||sx>band.x1-24||sy<band.y0+24||sy>band.y1-24)focusNote(p,w.z);
}
function openCard(p){
  sel=p;
  tipEl.querySelector('.dt').textContent=p.d;
  tipEl.querySelector('.tg').innerHTML=(p.g||[]).map(t=>'<i>'+esc(t)+'</i>').join('');
  // 公开版把正文剥掉了，这里别写「无正文」——那是在说这条笔记没内容，
  // 而事实是它被我们拿掉了。说清楚，并把出口指给下面那个 flomo 链接。
  tipEl.querySelector('.bd').textContent=p.b||(CFG.REDACT
    ?'这条笔记的正文不在公开版里。点下面的按钮回 flomo 看原文。'
    :(CFG.ENCRYPTED
      ?'这条笔记的正文是加密的。点右上角「解锁正文」输入口令，之后就能在这里直接读到。'
      :'(无正文)'));
  const a=tipEl.querySelector('.go');
  a.href='https://v.flomoapp.com/mine/?memo_id='+encodeURIComponent(p.s||'');
  a.style.display=p.s?'inline-block':'none';
  tipEl.classList.add('on'); document.body.classList.add('card-open');
}
function closeCard(){tipEl.classList.remove('on');document.body.classList.remove('card-open');}
tipEl.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();closeCard();sel=null;});
addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  // 一层一层退：先收卡片，再收漫步，最后回全图。每次按都往前走一步，
  // 不会出现「按了没反应」——那种时候人就以为程序坏了。
  if(tipEl.classList.contains('on')){closeCard();sel=null;}
  else if(walk)stopWalk();
  else if(offFit(wantCam()))fitAll();
});

// ============================================================
// 随机漫步：沿着「隐性的联系」在笔记之间跳。
// 大多数步子是当前笔记的最近邻，偶尔来一次与谁都无关的大跨越——
// 那一下正是 flomo 说的「弱相关性的大跨越」，也是整场漫步里最可能撞见意外的地方。
// 清单与小径同步生长，点任意一条都能回到地图上那一点看全文。
// ============================================================
const walkBtn=document.getElementById('walkbtn');
const jList=journeyEl.querySelector('.list'), jStats=journeyEl.querySelector('.stats');
const jRow=(k,v)=>'<div class="row"><span>'+k+'</span><b>'+v+'</b></div>';

function startWalk(){
  const N=P.length;
  let cur=(sel&&P.indexOf(sel)>=0)?P.indexOf(sel):Math.floor(Math.random()*N);
  const steps=12+Math.floor(Math.random()*9);
  const path=[cur],jump=[];
  for(let i=1;i<steps;i++){
    const opts=(nb[cur]||[]).filter(j=>j>=0&&j<N);
    let nx;
    if(opts.length&&Math.random()>0.16){
      // 偏向前几个最近邻，但不是永远走最近的那个——否则小径会原地打转
      nx=opts[Math.floor(Math.pow(Math.random(),1.7)*opts.length)];
    }else{
      nx=Math.floor(Math.random()*N);
      if(nx!==cur)jump.push(i);
    }
    if(nx===cur)nx=(cur+1)%N;
    path.push(nx); cur=nx;
  }
  closeCard();
  setPlay(false);
  setMonth(MAXM);              // 小径横跨所有月份，底图得把笔记都摆出来
  jList.innerHTML='';          // 上一场漫步的清单不能留在这一场里
  walk={path,jump,t:0,t0:performance.now(),dur:Math.max(2800,(path.length-1)*380),
        done:false,shown:0,sel:-1};
  journeyEl.classList.add('on');
  document.body.classList.add('walking');
  revealUpTo(1);
  // 清单占了左侧之后要重排基准布局（leftInset 变了），并且直接回到全图——
  // 小径横跨整张图，待在放大状态里就看不见它了。模式切换不播过场，
  // 所以这里是「重排 → 直接烘焙」而不是 fitAll()。
  layout(); zanim=null; bakeAt=0; want=clampT({z:1,tx:0,ty:0}); bakeCam(want);
  walkBtn.textContent='结束漫步';
}
function stopWalk(){
  walk=null;
  journeyEl.classList.remove('on');
  document.body.classList.remove('walking');
  jList.innerHTML='';
  walkBtn.textContent='随机漫步';
  layout(); zanim=null; bakeAt=0; want=clampT(want); bakeCam(want);   // 把让出去的半个宽度收回来
}
walkBtn.addEventListener('click',()=>walk?stopWalk():startWalk());
journeyEl.querySelector('.x').addEventListener('click',stopWalk);

// 清单跟着小径长：小径走到第几条，清单就落到第几条。一次性全列出来
// 等于把这次旅程提前剧透完，那这条小径也就没有走的意义了。
function revealUpTo(n){
  if(!walk)return;
  const frag=document.createDocumentFragment();
  for(let i=walk.shown;i<n;i++){
    const p=P[walk.path[i]], isJump=walk.jump.indexOf(i)>=0;
    const li=document.createElement('li');
    li.className='wrow'+(i===walk.sel?' on':'');
    li.dataset.i=String(i);
    li.innerHTML='<span class="dot" style="background:'+HUES[(+p.c)%8]+'"></span>'
      +'<span class="col"><span class="dt">'+esc(p.d||'—')+'</span>'
      +'<span class="tx">'+esc(String(p.t||p.b||'（无正文）').replace(/s+/g,' ').slice(0,46))+'</span></span>'
      +(isJump?'<i class="mk">跨越</i>':'');
    frag.appendChild(li);
  }
  jList.appendChild(frag);
  walk.shown=n;
  renderStats();
  // 已经翻到上面在读的时候别把人拽回底部
  if(jList.scrollHeight-jList.scrollTop-jList.clientHeight<140)jList.scrollTop=jList.scrollHeight;
}
function renderStats(){
  if(!walk)return;
  const at=walk.path.slice(0,walk.shown).map(i=>P[i]);
  const ds=at.map(p=>p.d).filter(Boolean).sort();
  const days=ds.length>1
    ?Math.round((new Date(ds[ds.length-1].slice(0,10))-new Date(ds[0].slice(0,10)))/86400000):0;
  const chars=at.reduce((s,p)=>s+(p.b||'').length,0);
  const jumps=walk.jump.filter(i=>i<walk.shown).length;
  jStats.innerHTML=
    jRow('经过笔记',at.length+' 条')+
    jRow('跨越时间',ds.length>1?days.toLocaleString('zh-CN')+' 天':'—')+
    jRow('穿越文字',chars.toLocaleString('zh-CN')+' 字')+
    jRow('弱相关大跨越',jumps?jumps+' 次':'没有出现');
}
// 点清单里任意一条：把它推进可见区并翻出全文。清单和地图是同一件事的两面。
jList.addEventListener('click',e=>{
  const li=e.target.closest('.wrow');
  if(!li||!walk)return;
  walk.sel=+li.dataset.i;
  for(const r of jList.children)r.classList.toggle('on',r===li);
  const p=P[walk.path[walk.sel]];
  openCard(p);
  revealNote(p);
});

// ---- 时间轴 ----
const track=document.getElementById('track'),fill=document.getElementById('fill'),
  knob=document.getElementById('knob'),when=document.getElementById('when'),
  playBtn=document.getElementById('play'),
  mtip=document.getElementById('mtip'),mtipM=mtip.querySelector('b'),mtipN=mtip.querySelector('span');
// 每月各有多少条。field() 给的是「截至该月的累计」，问不了单月，而轴上真正想知道的是
// 哪几个月密——密度是这张图的主题，时间轴上不该只有刻度。
const perM=months.map((_,i)=>P.filter(p=>p.m===i).length);
for(let i=0;i<months.length;i++){
  const t=document.createElement('div');
  t.className='tick'; t.style.left=(i/MAXM*100)+'%'; track.appendChild(t);
}
function showTip(m){
  // 牌跟着月份走，不跟着指针走：轴是按月跳的（旋钮也一样跳），牌悬在两个刻度中间
  // 就说不清它在指哪个月。悬停只是预览，不改月份——改月份只能靠按下。
  mtipM.textContent=months[m];
  mtipN.textContent=perM[m]+' 条';
  const w=track.getBoundingClientRect().width, half=mtip.offsetWidth/2;
  const x=(MAXM?m/MAXM:0)*w;
  mtip.style.left=Math.max(half,Math.min(w-half,x))+'px';
  mtip.classList.add('on');
}
function hideTip(){mtip.classList.remove('on');}
function monthAt(e){
  const r=track.getBoundingClientRect();
  return Math.max(0,Math.min(MAXM,Math.round((e.clientX-r.left)/r.width*MAXM)));
}
function setMonth(v){
  curM=Math.max(0,Math.min(MAXM,Math.round(v)));
  const f=(MAXM?curM/MAXM:0)*100;
  fill.style.width=f+'%'; knob.style.left=f+'%';
  when.innerHTML=months[curM]+' <b>'+field(curM).n+'</b>/'+P.length+' 条';
}
function pick(e){
  const m=monthAt(e);
  setMonth(m); showTip(m);
}
let dragging=false;
track.addEventListener('pointerdown',e=>{
  dragging=true; try{track.setPointerCapture(e.pointerId);}catch{} pick(e);
});
track.addEventListener('pointermove',e=>{
  // 悬停只出牌，不动月份——不然光是划过就把图改了
  if(dragging)pick(e); else showTip(monthAt(e));
});
track.addEventListener('pointerleave',hideTip);
// pointercancel 必须也收手：触屏上被系统抢走指针时只有它会来，
// 漏掉的话 dragging 永远为真，之后每次划过时间轴都会改月份。
const endScrub=()=>{dragging=false;};
track.addEventListener('pointerup',endScrub);
track.addEventListener('pointercancel',endScrub);
// 播放：每帧一个月。定时器只在播放时存在
let timer=null;
function setPlay(on){
  playing=on;
  playBtn.innerHTML=on?'<svg width="11" height="12" viewBox="0 0 11 12" fill="currentColor"><rect x="0" y="0" width="3.6" height="12"/><rect x="7.4" y="0" width="3.6" height="12"/></svg>'
    :'<svg width="11" height="12" viewBox="0 0 11 12" fill="currentColor"><path d="M0 0l11 6-11 6z"/></svg>';
  clearInterval(timer); timer=null;
  if(!on)return;
  hideTip();   // 播放时月份自己会走，牌再挂在那儿就成了第二个说法
  if(curM>=MAXM)setMonth(0);
  timer=setInterval(()=>{
    if(curM>=MAXM){setPlay(false);return;}
    setMonth(curM+1);
  },420);
}
playBtn.addEventListener('click',()=>setPlay(!playing));

// ---- 正文锁（只在密文版出现）----
// 页面里带的是整包密文；口令不进 URL、不发请求，只在本地 WebCrypto 里过一遍。
// 「记住」默认不勾：勾了口令会落在这个域的 localStorage 里，而 weiky27.github.io
// 底下还挂着别的公开页面，同源脚本读得到。默认不落盘更稳，想要省事再自己勾。
const lockBtn=document.getElementById('unlock'),lockPanel=document.getElementById('lockp');
const lockIn=document.getElementById('lockpin'),lockErr=document.getElementById('lockerr');
const lockRem=document.getElementById('lockrem'),lockGo=document.getElementById('lockgo');
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function lockUI(state,msg){
  if(!lockBtn)return;
  if(state==='open'){lockBtn.textContent='🔓 正文已解锁';lockBtn.disabled=true;lockPanel.hidden=true;}
  else{lockBtn.textContent='🔒 解锁正文';lockBtn.disabled=false;lockBtn.hidden=false;
       if(state==='asking')lockPanel.hidden=false;}
  lockErr.textContent=msg||'';
}
async function deriveBodies(pass){
  const E=CFG.ENC;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64d(E.salt),iterations:E.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(E.iv)},key,b64d(E.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
let unlocking=false;
async function tryUnlock(pass,silent){
  if(unlocking)return false;
  unlocking=true;
  try{
    const map=await deriveBodies(pass);
    for(const p of P)if(Object.prototype.hasOwnProperty.call(map,p.s))p.b=map[p.s];
    try{
      if(lockRem&&lockRem.checked)localStorage.setItem('cogmap-pin',pass);
      else localStorage.removeItem('cogmap-pin');
    }catch(_){}
    lockUI('open');
    if(sel)openCard(sel);    // 卡片可能正开着「正文是加密的」，解锁后要就地刷新
    if(walk)renderStats();   // 「穿越文字」按正文长度算，锁开了才准
    return true;
  }catch(e){
    try{ localStorage.removeItem('cogmap-pin'); }catch(_){}
    // AES-GCM 校验失败就是口令不对，没有别的可能，别让人以为是页面坏了
    lockUI('locked',silent?'':'口令不对。');
    return false;
  }finally{ unlocking=false; }
}
if(CFG.ENCRYPTED){
  lockUI('locked');
  lockGo.addEventListener('click',()=>tryUnlock(lockIn.value,false));
  lockIn.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock(lockIn.value,false);});
  lockBtn.addEventListener('click',()=>{
    if(lockPanel.hidden){lockPanel.hidden=false;lockIn.focus();}else lockPanel.hidden=true;
  });
  let saved=null; try{ saved=localStorage.getItem('cogmap-pin'); }catch(_){}
  if(saved){ lockRem.checked=true; tryUnlock(saved,true).then(ok=>{if(!ok)lockRem.checked=false;}); }
}

// ---- 起手 ----
applyTheme('ink');
size(); setMonth(curM); setPlay(false);
// 只读的相机/漫步读数。classic script 里的顶层 let 不挂在 window 上，
// 没有这个口子，浏览器控制台和自动化探针都看不到相机到底在哪。
window.cogmapState=()=>({
  z:wantCam().z, tx:wantCam().tx, ty:wantCam().ty,
  bakedZ:cam.z, animating:!!zanim, pendingBake:!!bakeAt,
  month:curM, selected:sel?sel.d:null,
  selScreen:sel?{x:Math.round(px(sel)),y:Math.round(py(sel))}:null,
  band:{x0:0,x1:W,y0:PADT,y1:H-bottomCover()},
  walk:walk?{shown:walk.shown,total:walk.path.length,done:walk.done}:null,
  // 密文版的自检口子：withBodies 在解锁前必须是 0，解锁后等于 ENC.n
  encrypted:!!CFG.ENCRYPTED, withBodies:P.filter(p=>p.b).length,
});
requestAnimationFrame(draw);
</script>
